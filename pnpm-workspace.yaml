# pnpm blocks dependency postinstall scripts by default; these are the ones we
# actually need to run (native binaries / browser & ffmpeg downloads).
# @scarf/scarf and core-js are intentionally NOT allowed (telemetry / funding
# banner only).
allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': false
  core-js: false
  cypress: true
  esbuild: true
  ffmpeg-static: true
  protobufjs: true
  sharp: true
  vue-demi: true
# pnpm's minimumReleaseAgeExclude only keeps the FIRST matching rule per package
# name (createPackageVersionPolicy returns on first match) — two separate entries
# for the same package silently drop every version after the first. Multiple
# versions of one package MUST be unioned with "||" in a single entry.
minimumReleaseAgeExclude:
  - biatec-concentrated-liquidity-amm@0.9.43||0.9.44
