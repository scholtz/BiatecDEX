# Stand-ins for the two applications behind the ingress: the DEX app (labelled so that the REAL biatec-dex-beta-service
# selects it) and the chat backend (its Service is the one the ExternalName Service in the manifest points at).
apiVersion: v1
kind: Namespace
metadata: {name: biatec}
---
apiVersion: v1
kind: Namespace
metadata: {name: biatec-chat-stage}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: dex-nginx, namespace: biatec}
data:
  default.conf: |
    server {
      listen 8080;
      location / { default_type text/plain; return 200 "DEX-APP path=$request_uri host=$host\n"; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: fake-dex, namespace: biatec}
spec:
  replicas: 1
  selector: {matchLabels: {app: biatec-dex-beta}}
  template:
    metadata: {labels: {app: biatec-dex-beta}}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 8080}]
          volumeMounts: [{name: conf, mountPath: /etc/nginx/conf.d}]
      volumes: [{name: conf, configMap: {name: dex-nginx}}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: chat-app, namespace: biatec-chat-stage}
data:
  app.py: |
    import time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    class H(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"
        def do_GET(self): self.handle_any()
        def do_POST(self): self.handle_any()
        def handle_any(self):
            if self.path.split("?")[0].endswith("/stream"):
                self.send_response(200)
                self.send_header("Content-Type", "text/event-stream")
                self.send_header("Cache-Control", "no-cache")
                self.send_header("Transfer-Encoding", "chunked")
                self.end_headers()
                for i in range(4):
                    chunk = f"data: tick {i} t={time.time():.2f}\n\n".encode()
                    self.wfile.write(b"%x\r\n%s\r\n" % (len(chunk), chunk)); self.wfile.flush()
                    time.sleep(1)
                self.wfile.write(b"0\r\n\r\n"); return
            body = f"CHAT-BACKEND method={self.command} path={self.path} host={self.headers.get('Host')} xfp={self.headers.get('X-Forwarded-Prefix')} xfh={self.headers.get('X-Forwarded-Host')} origin={self.headers.get('Origin')} cookie={self.headers.get('Cookie')}\n".encode()
            self.send_response(200); self.send_header("Content-Type", "text/plain"); self.send_header("Content-Length", str(len(body))); self.end_headers(); self.wfile.write(body)
        def log_message(self, *a): pass
    ThreadingHTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: fake-chat, namespace: biatec-chat-stage}
spec:
  replicas: 1
  selector: {matchLabels: {app: fake-chat}}
  template:
    metadata: {labels: {app: fake-chat}}
    spec:
      containers:
        - name: py
          image: python:3.12-alpine
          command: ["python", "/app/app.py"]
          ports: [{containerPort: 8080}]
          volumeMounts: [{name: app, mountPath: /app}]
      volumes: [{name: app, configMap: {name: chat-app}}]
---
apiVersion: v1
kind: Service
metadata: {name: biatec-chat-backend, namespace: biatec-chat-stage}
spec:
  selector: {app: fake-chat}
  ports: [{name: http, port: 80, targetPort: 8080}]
