name: Generate help screenshots (docs image)

# Manual only - this is the slow step (installs Chromium + OS deps, boots a dev
# server, captures a screenshot per locale/use case) that used to run on every
# single deploy inside docker/Dockerfile. Run this whenever the help screenshots
# need refreshing (UI changed, new locale, new use case); every normal app deploy
# then just pulls whatever this last produced (see docker/Dockerfile's `docs` stage)
# instead of regenerating anything.
on:
  workflow_dispatch: {}

env:
  IMAGE: scholtz2/biatec-dex-docs

jobs:
  build-docs-image:
    name: Build and push docs (help screenshots) image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate version
        id: vars
        run: |
          DATE=$(date +'%Y.%m.%d')
          echo "version=1.$DATE" >> "$GITHUB_OUTPUT"

      - name: Build and push docs image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.docs
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.vars.outputs.version }}
          build-args: |
            PRIMEVUE_LICENSE=${{ secrets.PRIMEVUE_LICENSE }}
